name: build-and-release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write      # needed to create the release

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION in src/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE_VERSION=$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('src/version.py').read()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION  src/version.py=$FILE_VERSION"
          [ "$FILE_VERSION" = "$TAG_VERSION" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $FILE_VERSION in src/version.py"; exit 1; }

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (tests, app, self-test, installer, portable exe)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -Portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  macos:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       arch: arm64 }      # Apple Silicon
          - { os: macos-15-intel, arch: x86_64 }     # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build (tests, app, self-test, dmg)
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create update.json (checksums of the installers)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then NOTES=$(cat RELEASE_NOTES.md); else NOTES="QR Studio Pro $TAG"; fi
          python scripts/make_update_manifest.py \
            --base-url "https://github.com/$REPO/releases/download/$TAG" \
            --page "https://github.com/$REPO/releases/tag/$TAG" \
            --notes "$NOTES"
          ls -l dist; cat dist/update.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then NOTES_ARG="--notes-file RELEASE_NOTES.md"; else NOTES_ARG="--generate-notes"; fi
          gh release create "$TAG" dist/*.exe dist/*.dmg dist/update.json --title "QR Studio Pro $TAG" $NOTES_ARG